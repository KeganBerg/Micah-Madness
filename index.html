<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173a52" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" />
    <title>Micah Madness</title>
    <link rel="icon" type="image/png" href="./icons/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Micah" />
  </head>
  <body style="margin:0;background:#173a52">
    <div id="app">
      <div class="launch" role="status" aria-live="polite">
        <div class="launch-center">
          <div class="launch-stage">
            <span class="launch-shadow"></span>
            <img class="launch-micah" src="/src/assets/micah.png" alt="Micah in her lobster costume" />
          </div>
          <h1 class="launch-title"><span>Micah</span><span>Madness</span></h1>
          <p class="launch-tag">A match-3 puzzle for dog lovers</p>
        </div>
        <div class="launch-foot">
          <div class="launch-bar" aria-hidden="true"><i></i></div>
          <p class="launch-step">Fetching the toys…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
